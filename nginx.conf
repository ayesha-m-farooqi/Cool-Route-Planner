server {
    listen 5782;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Reverse-proxy API calls to the backend container (Compose service
    # name "backend", resolved via Docker's internal DNS). Keeps the
    # frontend bundle free of any backend host/port.
    location /api/ {
        proxy_pass http://backend:5772/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # SPA fallback — client-side router (if any) handles unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
